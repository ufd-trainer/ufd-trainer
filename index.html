// ---------- calculator ----------
var C={expr:'', prev:'', mem:0, fresh:false};
function cParse(s){
  var t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  var toks=t.match(/\d*\.?\d+(?:e[+-]?\d+)?|\d+\.|[-+*/^()]/g); if(!toks||toks.join('')!==t.replace(/\s/g,'')) throw 0;
  var out=[], ops=[], prec={'+':1,'-':1,'*':2,'/':2,'neg':3,'^':4}, prev=null;
  toks.forEach(function(k){
    if(/^[\d.]/.test(k)){ out.push(parseFloat(k)); }
    else if(k==='('){ ops.push(k); }
    else if(k===')'){ while(ops.length && ops[ops.length-1]!=='(') out.push(ops.pop()); if(!ops.length) throw 0; ops.pop(); }
    else {
      if(k==='-' && (prev===null || /^[-+*/^(]$/.test(prev) || prev==='neg')) k='neg';
      else if(k==='+' && (prev===null || prev==='(')) { prev=k; return; }
      while(ops.length){ var o=ops[ops.length-1]; if(o==='(') break;
        if((k==='^'||k==='neg') ? prec[o]>prec[k] : prec[o]>=prec[k]) out.push(ops.pop()); else break; }
      ops.push(k);
    }
    prev=k;
  });
  while(ops.length){ var o=ops.pop(); if(o==='(') throw 0; out.push(o); }
  var st=[];
  out.forEach(function(x){
    if(typeof x==='number') st.push(x);
    else if(x==='neg'){ if(!st.length) throw 0; st.push(-st.pop()); }
    else { if(st.length<2) throw 0; var b=st.pop(), a=st.pop();
      st.push(x==='+'?a+b:x==='-'?a-b:x==='*'?a*b:x==='/'?a/b:Math.pow(a,b)); }
  });
  if(st.length!==1||!isFinite(st[0])) throw 0;
  return st[0];
}
function cFmt(n){ var r=parseFloat(n.toPrecision(12)); var s=String(r); return s.replace('-','−'); }
function cVal(){ // value of current expression, auto-closing brackets
  var e=C.expr||'0'; var open=(e.match(/\(/g)||[]).length-(e.match(/\)/g)||[]).length; while(open-->0) e+=')';
  return cParse(e);
}
var TRAIL=/(\d*\.?\d+(?:e[+-]?\d+)?|\d+\.)$/;
function cKey(k){
  var e=C.expr, last=e.slice(-1);
  try{
    if(/^[0-9.]$/.test(k)){
      if(C.fresh){ e=''; C.prev=''; }
      var m=e.match(TRAIL);
      if(k==='.' && m && m[0].indexOf('.')>=0) return;
      if(last===')') e+='×';
      e+= (k==='.' && !m) ? '0.' : k;
      C.fresh=false;
    } else if('+−×÷^'.indexOf(k)>=0){
      if(C.fresh) C.fresh=false;
      if(e==='' && k!=='−') e='0';
      if(/[+−×÷^]$/.test(e)) e = (k==='−' && !/−$/.test(e)) ? e+k : e.slice(0,-1)+k;
      else if(last==='(' && k!=='−') return;
      else e+=k;
    } else if(k==='('){
      if(C.fresh){ e=''; C.fresh=false; }
      if(/[\d.)]$/.test(e)) e+='×';
      e+='(';
    } else if(k===')'){
      var open=(e.match(/\(/g)||[]).length-(e.match(/\)/g)||[]).length;
      if(open>0 && /[\d.)]$/.test(e)) e+=')';
    } else if(k==='='){
      if(!e) return; var v=cVal(); C.prev=e+' ='; e=cFmt(v); C.fresh=true;
    } else if(k==='inv'){
      var v2=cVal(); if(v2===0) throw 0; C.prev='1/('+(e||'0')+')'; e=cFmt(1/v2); C.fresh=true;
    } else if(k==='%'){
      var m2=e.match(TRAIL); if(!m2) return; e=e.slice(0,-m2[0].length)+cFmt(parseFloat(m2[0])/100).replace('−','');
    } else if(k==='neg'){
      if(C.fresh && e){ e = e.charAt(0)==='−' ? e.slice(1) : '−'+e; C.fresh=true; }
      else { var wrap=e.match(/\(−(\d*\.?\d+(?:e[+-]?\d+)?)\)$/);
        if(wrap) e=e.slice(0,-wrap[0].length)+wrap[1];
        else { var m3=e.match(TRAIL); if(!m3) return; e=e.slice(0,-m3[0].length)+'(−'+m3[0]+')'; } }
    } else if(k==='CE'){
      var m4=e.match(TRAIL); e = m4 ? e.slice(0,-m4[0].length) : e.slice(0,-1); C.fresh=false;
    } else if(k==='C'){ e=''; C.prev=''; C.fresh=false; }
    else if(k==='MC'){ C.mem=0; }
    else if(k==='M+'){ var v3=cVal(); C.mem+=v3; C.prev='M+ '+cFmt(v3); e=cFmt(v3); C.fresh=true; }
    else if(k==='MR'){
      var mv=cFmt(C.mem); var neg=mv.charAt(0)==='−'; if(neg) mv='(−'+mv.slice(1)+')';
      if(C.fresh){ e=''; C.fresh=false; }
      var m5=e.match(TRAIL); if(m5) e=e.slice(0,-m5[0].length); if(/\)$/.test(e)) e+='×';
      e+=mv;
    }
    C.expr=e;
  }catch(err){ C.prev='Can\u2019t calculate that'; C.expr=''; C.fresh=true; }
  cShow();
}
function cShow(){
  document.getElementById('cmain').textContent=C.expr||'0';
  document.getElementById('cprev').textContent=C.prev;
  document.getElementById('cmem').textContent=C.mem!==0?'M':'';
}

    case 'frevealall': document.querySelectorAll('#fbody .ans').forEach(function(x){x.hidden=false;}); document.querySelectorAll('#fbody [data-a="freveal"]').forEach(function(x){x.remove();}); el.remove(); break;
    case 'theme': S.theme=p; save(); render(); break;
    case 'both': go('both'); break;
    case 'notsure': go('notsure'); break;
    case 'hub': go('hub',{p:p}); break;
    case 'topics': go('topics',{p:p}); break;
    case 'lesson': go('lesson',{p:p,lv:'an'}); break;
    case 'lv': V.lv=p; render(); break;
    case 'practise': startPractice(p); break;
    case 'fresh': startPractice(p, true); break;
    case 'genessay': E=null; go('essay',{p:newEssay()}); break;
    case 'report': copyPlain(reportText(M.mq[+p], M.qs[+p]), 'Question copied. Paste it into your message to whoever shared this tool.'); break;
    case 'preport': copyPlain(reportText(P.list[P.i], P.st), 'Question copied. Paste it into your message to whoever shared this tool.'); break;
    case 'pick': if(!P.st.done){ P.st.sel=+p; P.st.checked=false; render(); } break;
    case 'hint': P.st.hint=true; render(); break;
    case 'check': checkPractice(); break;
    case 'simpler': P.st.simpler++; render(); break;
    case 'copilot': copyText(copilotPrompt(P.list[P.i], TOPICS[P.tid])); break;
    case 'harder': var q=P.list[P.i], m=P.st.mode+1; newQState(); P.st.mode=m; P.st.opts=q.blanks.map(function(b){return blankOptions(q,b,m);}); render(); break;
    case 'next': if(P.i<P.list.length-1){ P.i++; newQState(); render(); window.scrollTo(0,0); } else go('practiceDone'); break;
    case 'diag': startDiag(p); break;
    case 'dpick': D.list[D.i].sel=+p; render(); break;
    case 'dnext': if(D.i<D.list.length-1){ D.i++; render(); window.scrollTo(0,0); } else go('diagDone'); break;
    case 'mockintro': if(M&&M.submitted) M=null; go('mockintro',{p:p}); break;
    case 'mockstart': startMock(p); break;
    case 'mockgo': M.i=+p; render(); window.scrollTo(0,0); break;
    case 'mocksubmit': submitMock(false); break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches('textarea[data-essay]') && M && !M.submitted){ M.qs[M.i].text[+t.getAttribute('data-essay')]=t.value; var btn=document.querySelectorAll('.qgrid button')[M.i]; if(btn) btn.classList.toggle('done', answered(M.mq[M.i], M.qs[M.i])); }
  if(t.matches('textarea[data-draft]') && E){ S.drafts=S.drafts||{}; S.drafts[E.id]=S.drafts[E.id]||[]; S.drafts[E.id][+t.getAttribute('data-draft')]=t.value; save(); }
});
document.addEventListener('change',function(e){
  var c=e.target;
  if(c.matches('input[data-tick]')){
    var key=c.getAttribute('data-tick'), pi=+c.getAttribute('data-part'), k=+c.getAttribute('data-pt');
    var q, ticks;
    if(key==='ess'){ q=ESSAYS[E.id]; ticks=E.ticks; }
    else { var n=+key.slice(1); q=M.mq.filter(function(x){return x.n===n;})[0]; M.self[n]=M.self[n]||{}; ticks=M.self[n]; }
    ticks[pi]=ticks[pi]||[]; var ix=ticks[pi].indexOf(k); if(c.checked&&ix<0) ticks[pi].push(k); if(!c.checked&&ix>=0) ticks[pi].splice(ix,1);
    var s=0; ticks[pi].forEach(function(j){ s+=q.parts[pi].points[j][1]; });
    var ps=document.getElementById('ps-'+key+'-'+pi); if(ps) ps.textContent=Math.min(s,q.parts[pi].marks)+'/'+q.parts[pi].marks;
    if(key==='ess'){ document.getElementById('esstot').textContent=essayScoreHTML(q,ticks).tot; }
    else { var T=mockTotals(); document.getElementById('selftot').textContent=T.self; document.getElementById('esttot').textContent=T.total; saveMockBest(); }
    return;
  }
  var s=e.target; if(!s.matches('select[data-blank]')) return;
  var i=+s.getAttribute('data-blank');
  if(V.name==='mock'){ M.qs[M.i].sel[i]=s.value; var btn=document.querySelectorAll('.qgrid button')[M.i]; if(btn) btn.classList.toggle('done', answered(M.mq[M.i], M.qs[M.i])); }
  else if(P){ P.st.sel[i]=s.value; }
});
// mock MCQ picks: route to the mock state instead of practice
document.addEventListener('click',function(e){
  if(V.name!=='mock') return; var el=e.target.closest('.opt[data-a="pick"]'); if(!el) return;
  e.stopImmediatePropagation();
  M.qs[M.i].sel=+el.getAttribute('data-p'); render();
},true);

render();
})();
</script>

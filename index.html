<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C6A53">
<title>UFD trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<style>
:root{
  --paper:#F3F6F4; --card:#FFFFFF; --ink:#172233; --muted:#566476;
  --ledger:#2C6A53; --ledger-ink:#FFFFFF; --ledger-2:#E3EEE8; --rule:#CCD9D2;
  --hi:#F6D55C; --bad:#A8402E; --bad-bg:#F8E7E3; --good:#2C6A53; --good-bg:#E0EFE6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111916; --card:#18221E; --ink:#E4ECE8; --muted:#9FB1A9;
    --ledger:#6FBF9C; --ledger-ink:#0E1612; --ledger-2:#1E2F28; --rule:#2F413A;
    --hi:#7A6618; --bad:#EE937F; --bad-bg:#3A221D; --good:#7FCBA8; --good-bg:#1B3328;
  }
}
:root[data-theme="dark"]{
  --paper:#111916; --card:#18221E; --ink:#E4ECE8; --muted:#9FB1A9;
  --ledger:#6FBF9C; --ledger-ink:#0E1612; --ledger-2:#1E2F28; --rule:#2F413A;
  --hi:#7A6618; --bad:#EE937F; --bad-bg:#3A221D; --good:#7FCBA8; --good-bg:#1B3328;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans);font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:2rem;letter-spacing:-.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0 0 .8em}
a{color:var(--ledger)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}

/* masthead */
.mast{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.mast .code{font-size:.85rem;color:var(--muted)}
.back{background:none;border:0;padding:6px 0;color:var(--ledger);font-weight:600;margin-bottom:6px}

/* ledger rows: the core structural device */
.ledger{border-top:1px solid var(--rule);margin:0 0 22px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:15px 2px}
.row:hover{background:var(--ledger-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;display:block}
.row .s{color:var(--muted);font-size:.9rem;display:block}
.row .fig{font-family:var(--serif);font-size:1.05rem;color:var(--ledger);white-space:nowrap}
.row[disabled]{opacity:.55;cursor:default}
.row[disabled]:hover{background:none}
.unitlabel{font-size:.9rem;color:var(--muted);margin:18px 0 4px;font-weight:600}

.btn{display:inline-block;border:2px solid var(--ledger);background:var(--ledger);color:var(--ledger-ink);font-weight:600;border-radius:var(--r);padding:11px 18px;margin:4px 8px 4px 0}
.btn.ghost{background:transparent;color:var(--ledger)}
.btn.wide{display:block;width:100%;margin:10px 0}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--ledger);background:var(--ledger-2);font-weight:600}

.note{border-left:4px solid var(--ledger);background:var(--card);padding:12px 14px;margin:0 0 16px;border-radius:0 var(--r) var(--r) 0}
.note p:last-child{margin:0}
.warn{border-left-color:var(--bad)}
mark,.trap{background:linear-gradient(transparent 50%,var(--hi) 50%);color:inherit;padding:0 2px}
.traps{margin:0 0 18px;padding:0;list-style:none}
.traps li{margin:0 0 10px;padding-left:0}

/* tabs for explanation levels */
.tabs{display:flex;border-bottom:2px solid var(--ink);margin:6px 0 14px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ledger)}
.steps{padding-left:1.3em;margin:0 0 16px}
.steps li{margin-bottom:8px}
dl.defs{margin:0 0 16px}
dl.defs dt{font-weight:700;margin-top:10px}
dl.defs dd{margin:2px 0 0}

/* questions */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.stem{font-size:1.08rem;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:13px 14px;margin:0 0 9px}
.opt[aria-pressed="true"]{border-color:var(--ledger);box-shadow:inset 0 0 0 1px var(--ledger)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right,.opt.wrong{box-shadow:none}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);margin:0 2px;vertical-align:baseline}
.opt[disabled]{cursor:default}
.blank{background:var(--card);border-bottom:1px solid var(--rule);padding:12px 2px 14px}
.blank:first-child{border-top:1px solid var(--rule)}
.blank label{display:block;margin-bottom:8px}
.blank select{width:100%;background:transparent;border:0;border-bottom:2px solid var(--ink);padding:8px 2px;border-radius:0;appearance:auto}
.blank.right select{border-bottom-color:var(--good)}
.blank.wrong select{border-bottom-color:var(--bad)}
.fb{font-size:.95rem;margin-top:8px}
.fb.bad{color:var(--bad)}
.fb.good{color:var(--good)}
.panel{background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:14px;margin:14px 0}
.panel h3{font-size:1rem;font-family:var(--sans);font-weight:700}
.actions{margin-top:14px}
.tag{font-size:.8rem;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.progress{height:4px;background:var(--rule);border-radius:4px;margin:0 0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ledger)}

/* mock */
.mockbar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:16px}
.timer{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.timer.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0 16px}
.qgrid button{border:1.5px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 0;font-weight:600}
.qgrid button.done{background:var(--ledger-2);border-color:var(--ledger)}
.qgrid button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.score{font-family:var(--serif);font-size:3.2rem;line-height:1;margin:6px 0}
table.res{width:100%;border-collapse:collapse;margin:8px 0 18px}
table.res td{border-bottom:1px solid var(--rule);padding:9px 4px;vertical-align:top}
table.res td:last-child{text-align:right;white-space:nowrap;font-family:var(--serif)}

/* bottom bar */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar button{flex:1;max-width:213px;background:none;border:0;padding:10px 4px 12px;font-size:.85rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button .ic{font-size:1.25rem;line-height:1}
nav.bar button:hover{color:var(--ink)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:16px 16px 0 0;max-height:88%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease-out,visibility .22s;max-width:560px;margin:0 auto}
.sheet{visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.scrim.open{display:block}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheethead h2{margin:0;font-size:1.2rem}
.x{background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}

/* calculator */
.cdisp{background:var(--paper);border:1.5px solid var(--rule);border-radius:var(--r);padding:8px 12px;text-align:right;margin-bottom:10px;min-height:78px}
.cprev{font-size:.85rem;color:var(--muted);min-height:1.3em;overflow-wrap:anywhere}
.cmain{font-family:var(--serif);font-size:1.7rem;overflow-wrap:anywhere;line-height:1.2}
.cmem{float:left;font-size:.8rem;font-weight:700;color:var(--ledger)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.keys button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:12px 0;font-size:1.05rem;font-weight:600}
.keys button.fn{background:var(--ledger-2);font-size:.9rem}
.keys button.eq{background:var(--ledger);color:var(--ledger-ink);border-color:var(--ledger)}
.keys .s2{grid-column:span 2}.keys .s3{grid-column:span 3}
.frow{border-bottom:1px solid var(--rule);padding:11px 0}
.tablewrap{overflow-x:auto;margin:0 0 14px}
table.dt{border-collapse:collapse;font-size:.92rem;min-width:100%}
table.dt th,table.dt td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;white-space:normal}
table.dt tr:first-child th{border-bottom:2px solid var(--ink)}
textarea.ans{width:100%;min-height:150px;font:inherit;font-size:.98rem;line-height:1.5;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin:6px 0 4px;resize:vertical}
.part{margin:16px 0 18px}
.part .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:600}
.tag{flex:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule)}
.check input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--ledger)}
.check span{flex:1}
.check b{white-space:nowrap;font-family:var(--serif)}
.ceri{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 16px}
.ceri b{font-family:var(--serif);font-size:1.2rem;color:var(--ledger)}
.sheet .sec{font-weight:700;margin:16px 0 4px}
.frow b{display:block}
.frow .ans{margin-top:4px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:var(--r);max-width:92%;width:440px;font-size:.95rem;display:none}
.toast.show{display:block}
.toast a{color:var(--hi)}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<nav class="bar" aria-label="Tools">
  <button data-a="home"><span class="ic" aria-hidden="true">⌂</span>Home</button>
  <button data-a="calc"><span class="ic" aria-hidden="true">▦</span>Calculator</button>
  <button data-a="formulas"><span class="ic" aria-hidden="true">ƒ</span>Formulas</button>
</nav>

<div class="scrim" id="scrim" data-a="closesheet"></div>
<section class="sheet" id="sheet-calc" role="dialog" aria-label="Calculator" aria-modal="true">
  <div class="sheethead"><h2>Calculator</h2><button class="x" data-a="closesheet" aria-label="Close">×</button></div>
  <div class="cdisp"><span class="cmem" id="cmem"></span><div class="cprev" id="cprev"></div><div class="cmain" id="cmain">0</div></div>
  <div class="keys" id="keys">
    <button class="fn" data-k="MC">MC</button><button class="fn" data-k="MR">MR</button><button class="fn" data-k="M+">M+</button><button class="fn" data-k="CE">CE</button><button class="fn" data-k="C">C</button>
    <button class="fn" data-k="(">(</button><button class="fn" data-k=")">)</button><button class="fn" data-k="^" aria-label="x to the power y">xʸ</button><button class="fn" data-k="inv" aria-label="one over x">1/x</button><button class="fn" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="fn" data-k="%">%</button><button class="fn" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="fn" data-k="neg" aria-label="plus minus">+/−</button><button class="fn" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k=".">.</button><button class="fn" data-k="+">+</button>
    <button class="s3" data-k="0">0</button><button class="eq s2" data-k="=">=</button>
  </div>
  <p class="small muted" style="margin-top:12px">Memory tip for NPV: type <b>(1+0.08)^3</b>, press <b>1/x</b> to get the discount factor, multiply by the cash flow and press <b>M+</b>. Repeat for each year, then press <b>MR</b> and subtract the investment.</p>
</section>
<section class="sheet" id="sheet-formulas" role="dialog" aria-label="Formulas" aria-modal="true">
  <div class="sheethead"><h2 id="fhead">Formulas</h2><button class="x" data-a="closesheet" aria-label="Close">×</button></div>
  <div id="fbody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
// ===== TEST 1 CONTENT (Units 1–6) — sourced from module slides and tutor answers =====
var T1 = {
id: 't1',
name: 'Test 1',
units: 'Units 1–6',
weight: '60% of module',
mockMinutes: 90,
formulaNote: 'In 2026 a formula sheet was provided in Test 1. You still need to pick the right formula and the right figures.',
sheet: [
 ['Gross profit margin', 'Gross profit ÷ Sales revenue × 100'],
 ['Operating profit margin', 'Operating profit ÷ Sales revenue × 100'],
 ['ROSF', 'Profit for the year ÷ Total equity × 100'],
 ['ROCE', 'Operating profit ÷ (Total equity + Non-current liabilities) × 100'],
 ['Current ratio', 'Current assets ÷ Current liabilities'],
 ['Quick (acid test) ratio', '(Current assets − Inventories) ÷ Current liabilities'],
 ['Average inventory turnover period', 'Average inventories held ÷ Cost of sales × 365'],
 ['Average settlement period for trade receivables', 'Average trade receivables ÷ Credit sales × 365'],
 ['Average settlement period for trade payables', 'Average trade payables ÷ Credit purchases × 365'],
 ['Working capital', 'Current assets − Current liabilities'],
 ['Dividend payout ratio', 'Dividend announced for the year ÷ Earnings for the year available for dividend × 100'],
 ['Dividend cover ratio', 'Earnings for the year available for dividend ÷ Dividend announced for the year'],
 ['Dividend yield', 'Dividend per share ÷ Market value per share × 100'],
 ['EPS', 'Earnings available to ordinary shareholders ÷ Number of ordinary shares in issue × 100 (gives pence)'],
 ['P/E ratio', 'Market value per share ÷ EPS'],
 ['EVA', 'NOPAT − (R × C)   R = required rate of return, C = capital invested'],
 ['Gearing', 'Long-term (non-current) liabilities ÷ (Equity + Long-term liabilities) × 100'],
 ['Interest cover', 'Operating profit ÷ Interest payable'],
 ['ARR', 'Average annual profit ÷ Average investment × 100'],
 ['Discount factor', '1 ÷ (1 + r)ⁿ']
],
notOnSheet: [
 ['Payback period', 'Add up cash inflows year by year until they equal the investment. Part year = amount still needed ÷ that year\u2019s cash flow.'],
 ['NPV', 'Sum of (cash flow × discount factor) for each year − initial investment. Accept if positive.'],
 ['Cost of sales', 'Opening inventory + Purchases − Closing inventory'],
 ['Average (inventory, receivables, payables)', '(Opening + Closing) ÷ 2'],
 ['Number of shares', 'Share capital ÷ Nominal value per share'],
 ['Dividend per share', 'Total dividends ÷ Number of shares'],
 ['NOPAT', 'Operating profit × (1 − tax rate)'],
 ['ARR average profit', '(Total cash inflows − (Cost − Scrap)) ÷ Years, i.e. cash flow minus straight-line depreciation'],
 ['ARR average investment', '(Cost + Scrap value) ÷ 2'],
 ['Operating cash cycle', 'Inventory days + Receivables days − Payables days']
],
topics: [

// ---------------------------------------------------------------- 1
{id:'t1c1', unit:'Unit 1', title:'Accounting, users and qualities',
 sum:'Financial statements, users, qualitative characteristics',
 note:'The Unit 1 slides defining each quality, and the financial vs management accounting table, were images. These definitions follow the module textbook (Atrill & McLaney, Chapter 1).',
 an:{
  football:'The club\u2019s published accounts, read by fans, banks and the tax office, are financial accounting. The manager\u2019s weekly report on wages per player is management accounting. A transfer report that arrives after the window shuts is useless however accurate it is: that\u2019s timeliness.',
  business:'Your café\u2019s year-end accounts for the bank are financial accounting. Your own weekly sheet showing which sandwiches make money is management accounting. If the figures are wrong (not a faithful representation) or don\u2019t help you decide anything (not relevant), they\u2019re no use at all.',
  household:'The bank statement you show a letting agent is like financial accounting: standard format, for outsiders. Your own spending plan for next month is like management accounting: for you, in whatever detail you like.'
 },
 steps:[
  'Three main statements: income statement (profit over a period), balance sheet (wealth at a point in time), statement of cash flows (cash movements over a period).',
  'Financial accounting serves outside users with standard statements. Management accounting serves managers with detailed, tailored reports.',
  'Only TWO qualities are fundamental: relevance and faithful representation.',
  'The other four enhance usefulness: comparability, verifiability, timeliness, understandability.'
 ],
 exam:[
  ['Accounting','Provides financial information to help various user groups make more informed judgements and decisions.'],
  ['Income statement','Shows the wealth (profit) generated over a particular period.'],
  ['Balance sheet','Shows the accumulated wealth at a particular point in time.'],
  ['Statement of cash flows','Shows the cash movements over a particular period. Profit and cash generated for a period are rarely equal.'],
  ['Fundamental qualities','Relevance (capable of making a difference to decisions) and faithful representation (complete, neutral, free from error).'],
  ['Enhancing qualities','Comparability, verifiability, timeliness and understandability.'],
  ['Financial vs management accounting','Financial accounting presents results to external users via recognised financial statements. Management accounting provides detailed analyses (e.g. of costs) for managers.']
 ],
 traps:['Only relevance and faithful representation are fundamental. The rest are enhancing.','"Detailed analyses of costs for management" describes management accounting, not financial accounting.'],
 qs:[
  {id:'t1c1a', type:'mcq', lvl:1, diag:true,
   stem:'Which are the two FUNDAMENTAL qualitative characteristics of useful accounting information?',
   opts:[
    {t:'Relevance and faithful representation', ok:true},
    {t:'Comparability and timeliness', fb:'Both are enhancing qualities. They improve usefulness but aren\u2019t fundamental.'},
    {t:'Relevance and comparability', fb:'Relevance is fundamental, but comparability is an enhancing quality.'},
    {t:'Understandability and verifiability', fb:'Both are enhancing qualities.'}
   ],
   hint:'Information must make a difference to decisions, and it must be true. Which two capture that?',
   why:'The module: the fundamental qualities are relevance and faithful representation. Comparability, verifiability, timeliness and understandability enhance usefulness.'},
  {id:'t1c1b', type:'match', lvl:1,
   stem:'Match each description to the correct statement.',
   blanks:[
    {s:'Shows the wealth (profit) generated over a particular period: ___', a:'Income statement', c:'Balance sheet', x:['Statement of cash flows']},
    {s:'Shows the accumulated wealth at a particular point in time: ___', a:'Balance sheet', c:'Income statement', x:['Statement of cash flows']},
    {s:'Shows the cash movements over a particular period: ___', a:'Statement of cash flows', c:'Income statement', x:['Balance sheet']},
    {s:'Another name for the income statement: ___', a:'Statement of profit or loss', c:'Statement of financial position', x:['Statement of cash flows']},
    {s:'Another name for the balance sheet: ___', a:'Statement of financial position', c:'Statement of profit or loss', x:['Annual report']}
   ],
   hint:'"Over a period" is a video; "at a point in time" is a photo.',
   why:'From the Unit 1 tutorial: income statement = profit over a period; balance sheet = wealth at a point in time; cash flow statement = cash movements over a period.'},
  {id:'t1c1c', type:'mcq', lvl:1,
   stem:'A manager wants a weekly breakdown of costs for each product line to decide which one to drop. Which type of accounting provides this?',
   opts:[
    {t:'Management accounting', ok:true},
    {t:'Financial accounting', fb:'Financial accounting produces standard statements for outside users, not detailed cost analyses for managers.'},
    {t:'Auditing', fb:'Auditing checks financial statements. It doesn\u2019t produce product cost reports.'},
    {t:'Tax accounting', fb:'Tax accounting is about tax liabilities, not internal product decisions.'}
   ],
   hint:'Who is the report for: people outside or managers inside?',
   why:'Detailed, tailored cost analyses for managers are management accounting. Financial accounting presents results to outsiders via recognised statements.'},
  {id:'t1c1d', type:'match', lvl:2,
   stem:'Match each description to the qualitative characteristic.',
   blanks:[
    {s:'Capable of making a difference to decisions (predictive or confirmatory value): ___', a:'Relevance', c:'Timeliness', x:['Comparability']},
    {s:'Complete, neutral and free from error: ___', a:'Faithful representation', c:'Verifiability', x:['Understandability']},
    {s:'Lets users identify similarities and differences between businesses or over time: ___', a:'Comparability', c:'Relevance', x:['Verifiability']},
    {s:'Independent, knowledgeable observers would agree it faithfully represents what it claims: ___', a:'Verifiability', c:'Faithful representation', x:['Comparability']},
    {s:'Available to decision makers in time to influence their decisions: ___', a:'Timeliness', c:'Relevance', x:['Understandability']},
    {s:'Clear and concise for users with reasonable business knowledge: ___', a:'Understandability', c:'Comparability', x:['Timeliness']}
   ],
   hint:'Fundamental ones: does it matter (relevance) and is it true (faithful representation)?',
   why:'Definitions follow the module textbook (Atrill & McLaney, Chapter 1).'},
  {id:'t1c1e', type:'mcq', lvl:2,
   stem:'How is "timeliness" classified?',
   opts:[
    {t:'An enhancing qualitative characteristic', ok:true},
    {t:'A fundamental qualitative characteristic', fb:'Only relevance and faithful representation are fundamental.'},

{id:'t1c2', unit:'Unit 2', title:'Income statement and conventions',
 sum:'Layout from sales to profit for the year; accounting conventions',
 an:{
  football:'Matchday takings are sales revenue. The cost of the pies and shirts sold is cost of sales, and what\u2019s left is gross profit. Take off stadium wages and running costs to get operating profit. Take off loan interest to get profit before tax, then tax, and you have profit for the year.',
  business:'A café sells £10,000 of food; the ingredients used cost £4,000, so gross profit is £6,000. Rent, wages and energy of £3,500 leave £2,500 operating profit. Loan interest of £200 gives £2,300 profit before tax, then tax comes off.',
  household:'Your pay is like revenue. The direct cost of your job (travel, uniform) is like cost of sales. Bills and rent are like operating expenses. Credit card interest comes after that, and tax last.'
 },
 steps:[
  'Sales revenue − cost of sales = gross profit.',
  'Cost of sales = opening inventory + purchases − closing inventory (closing inventory is deducted because it hasn\u2019t been sold yet: the matching convention).',
  'Gross profit − operating expenses (distribution, administration, other) = operating profit (EBIT).',
  'Operating profit + non-operating income − finance costs (interest) = profit before tax.',
  'Profit before tax − taxation = profit for the year.'
 ],
 exam:[
  ['Income statement','Shows total revenue for a period minus the expenses incurred in generating it. The difference is profit or loss.'],
  ['Gross profit','The profit from buying and selling goods, without taking account of other revenues or expenses.'],
  ['Operating profit (EBIT)','Gross profit minus operating expenses: the wealth generated from the normal activities of the business.'],
  ['Profit for the year','Profit after finance costs and tax: a measure of the total wealth generated in the period.'],
  ['Matching convention','Expenses should be matched to the revenue they helped generate, in the period in which the revenue is reported.'],
  ['Accruals convention','Profit is revenue minus expenses, not cash received minus cash paid.'],
  ['Prudence convention','Report actual and expected losses immediately, but profits only when they arise.'],
  ['Other conventions','Time-period; business entity; consistency; historic cost; going concern; dual aspect.']
 ],

{id:'t1c3', unit:'Unit 2', title:'Profitability ratios',

  business:'Sandwich at £5, ingredients £3: gross margin 40%, so 40p of each £1 left before rent and wages. If rent rises and your operating margin falls while gross margin stays the same, you know the problem is overheads, not ingredients.',
  household:'Earn £2,000 and £1,200 goes on essentials: 40p of each £1 is left. If that shrinks to 20p after bills, your "overheads" are eating your income.'
 },
 steps:[
  'Gross profit margin = gross profit ÷ sales × 100.',
  'Operating profit margin = operating profit ÷ sales × 100.',
  'ROCE = operating profit ÷ (total equity + non-current liabilities) × 100.',
  'ROSF = profit for the year ÷ total equity × 100.',
  'Explain in pence: "for every £1 of sales, Xp is left as gross profit".',
  'Then give reasons (rising costs, pricing pressure, product mix, discounts), implications, and recommendations.'
 ],
 exam:[

  ['Recommendations','Cost control; pricing strategy; product mix; financial planning; continuous monitoring.']
 ],

{id:'t1c6', unit:'Unit 3', title:'Efficiency and working capital',

 an:{

 },
 steps:[
  'Inventory period = average inventory ÷ cost of sales × 365.',
  'Receivables period = average trade receivables ÷ credit sales × 365.',
  'Payables period = average trade payables ÷ credit purchases × 365.',
  'Average = (opening + closing) ÷ 2. Opening = last year\u2019s closing figure.',
  'Shorter inventory and receivables periods are usually better. A longer payables period helps cash flow, but not if it damages supplier relations.',
  'Compare with last year or the industry, give reasons, implications, then recommendations.'
 ],
 exam:[

  ['Inventory period','Average days to sell inventory. Longer may mean overstocking or slow-moving stock, tying up cash.'],
  ['Receivables period','Average days to collect payment from credit customers. Longer may mean poor credit control or staff failing to chase debts.'],
  ['Payables period','Average days to pay suppliers. Longer keeps cash (free finance) but may upset suppliers.'],
  ['Implications (inventory)','Higher holding costs; risk of obsolescence; cash flow constraints; customer satisfaction and competitiveness.'],
  ['Implications (receivables)','Negative cash flow; extra credit admin and bad debt costs; increased financing costs; reduced liquidity; strain on customer relationships.'],
  ['Recommendations','Inventory: demand forecasting, ABC analysis, safety stock and reorder levels, JIT/VMI. Receivables: clear credit policy, credit screening, early payment discounts, automated invoicing. Payables: negotiate terms, use early payment discounts, efficient invoice processing, cash flow forecasting.']
 ],

{id:'t1c7', unit:'Unit 4', title:'Investor ratios',
 sum:'EPS, dividend yield, payout, cover, P/E',
 an:{

 },
 steps:[

  'Dividend per share (DPS) = total dividends ÷ number of shares.',

 ],

  ['Agency problem','The conflict of interest between shareholders and directors from information asymmetry.']
 ],

{id:'t1c8', unit:'Unit 4', title:'EVA calculations',
 sum:'NOPAT, capital charge, economic value added',
 an:{
  football:'The club makes £10m operating profit, pays 20% tax, leaving £8m. But its owners and lenders have £100m tied up and want 10% a year, which is £10m. EVA = £8m − £10m = −£2m. On paper a profit, but it\u2019s destroying value.',
  business:'Your café makes £20,000 operating profit; after 25% tax that\u2019s £15,000. You\u2019ve invested £100,000 and expect 12% (£12,000). EVA = £15,000 − £12,000 = £3,000 of value created.',
  household:'Renting out a room brings £3,000 a year after tax. Money tied up in furnishing it could earn £500 elsewhere. The "EVA" of the room is £2,500.'
 },
 steps:[
  'Start from OPERATING profit.',
  'NOPAT = operating profit × (1 − tax rate).',
  'Capital charge = R × C (required return × capital invested).',
  'EVA = NOPAT − capital charge. Positive = creating shareholder wealth.'
 ],
 exam:[
  ['EVA','NOPAT − (R × C). NOPAT = net operating profit after tax; R = required returns of investors (WACC); C = capital invested (net assets).'],
  ['Why EVA','Traditional measures (ROSF, EPS) use accounting profit and don\u2019t take full account of investors\u2019 required returns. EVA gives the true economic profit.'],
  ['Improving EVA','Increase NOPAT (cut expenses or increase sales); reduce capital invested (sell under-performing assets); reduce R by changing the capital structure in favour of borrowing.']
 ],
 traps:['Start from operating profit and apply the tax rate yourself. Don\u2019t use profit after interest.','Multiply R by C before subtracting.'],
 qs:[
  {id:'t1c8a', type:'mcq', lvl:1, diag:true, calc:true,
   stem:'Operating profit £120m; interest £20m; tax rate 25%; capital invested £600m; required return 12%. What is EVA?',
   opts:[
    {t:'£18m', ok:true},
    {t:'£48m', fb:'You forgot tax. NOPAT = £120m × (1 − 0.25) = £90m.'},
    {t:'£3m', fb:'You deducted interest first. EVA starts from OPERATING profit: the capital charge covers the cost of all finance.'},
    {t:'−£510m', fb:'You subtracted the whole £600m. Subtract the charge: 12% × £600m = £72m.'},
    {t:'Cannot be calculated from the given information', last:true, fb:'You have everything: operating profit, tax rate, R and C.'}
   ],
   hint:'NOPAT = £120m × 0.75. Capital charge = 12% × £600m.',
   why:'NOPAT £90m − charge £72m = £18m.'},
  {id:'t1c8b', type:'mcq', lvl:1, calc:true,
   stem:'Operating profit is £200m and the tax rate is 20%. What is NOPAT?',
   opts:[
    {t:'£160m', ok:true},
    {t:'£40m', fb:'That\u2019s the tax. NOPAT is what\u2019s left.'},
    {t:'£240m', fb:'Tax is deducted, not added.'},
    {t:'£200m', fb:'NOPAT is AFTER tax.'}
   ],
   hint:'£200m × (1 − 0.20).',
   why:'£200m × 0.8 = £160m.'},
  {id:'t1c8c', type:'mcq', lvl:3, calc:true,
   stem:'NOPAT £30m; capital invested £400m; required return 9%. What is EVA?',
   opts:[
    {t:'−£6m', ok:true},
    {t:'£6m', fb:'Check the sign: £30m − £36m is negative.'},
    {t:'£21m', fb:'You subtracted £9m. The charge is 9% × £400m = £36m.'},
    {t:'−£370m', fb:'You subtracted the whole capital. Subtract the charge only.'}
   ],
   hint:'Capital charge = 0.09 × £400m.',
   why:'£30m − £36m = −£6m: the business isn\u2019t covering its investors\u2019 required return.'},
  {id:'t1c8d', type:'mcq', lvl:2,
   stem:'A company reports a healthy accounting profit but a negative EVA. What does this mean?',
   opts:[
    {t:'Its returns are below what investors require, so it is not increasing shareholder wealth', ok:true},
    {t:'It made an accounting error', fb:'Both can be correct: EVA also charges for the capital investors provide.'},
    {t:'It paid no tax', fb:'Tax affects NOPAT, but a negative EVA is about returns vs the capital charge.'},
    {t:'It has no debt', fb:'Capital structure affects R, but a negative EVA simply means NOPAT < R × C.'}
   ],
   hint:'EVA subtracts a charge for the capital used.',
   why:'EVA indicates whether returns exceed investors\u2019 required returns. Negative EVA = not increasing shareholder wealth, despite accounting profit.'},
  {id:'t1c8e', type:'mcq', lvl:2,
   stem:'According to the Unit 4 article (Chen & Dodd), why is EVA considered a superior performance measure?',
   opts:[
    {t:'It gives the true economic profit, taking account of the returns investors require', ok:true},
    {t:'It ignores tax, so it\u2019s easier to calculate', fb:'NOPAT is after tax.'},
    {t:'It replaces the need for any accounting profit figures', fb:'The authors say accounting earnings still carry significant information.'},
    {t:'It measures liquidity', fb:'EVA is about economic profit, not liquidity.'}
   ],
   hint:'"Economic" profit vs "accounting" profit.',
   why:'Key points: EVA gives the true economic profit and value created for shareholders; improving EVA is linked to higher stock returns.'}
 ]},

 sum:'Sources of finance, gearing, interest cover, debt vs equity',
 an:{
  football:'The club builds a new stand with a bank loan (debt) or by selling shares to fans (equity). The loan must be repaid with interest whatever the results; shareholders only get dividends if the club can afford them. Too much debt and one bad season means the club can\u2019t pay the bank.',
  business:'Your café expands with a £50,000 loan. If profit is £60,000 and interest is £5,000, interest cover is 12 times: comfortable. Borrow more and profit dips to £10,000 with interest at £8,000: cover 1.25 times. One bad month and you can\u2019t pay.',
  household:'A mortgage is like gearing: more borrowing against the house raises your risk. Interest cover is how many times your income covers the monthly interest.'
 },
 steps:[
  'Gearing = non-current liabilities ÷ (equity + non-current liabilities) × 100.',
  'Interest cover = operating profit ÷ interest payable.',
  'Gearing rises if long-term borrowing rises and/or equity falls. Interest cover falls if interest rises and/or operating profit falls.',
  'Debt: cheaper, tax-deductible interest, no loss of control, BUT fixed payments, security and covenants, default risk.',
  'Equity: no repayment, no obligatory ordinary dividends, BUT dilutes ownership, dividends not tax-deductible, costly to issue.'
 ],
 exam:[
  ['Capital structure','The mix of equity and debt used to finance the business\u2019s assets. The choice is the financing decision.'],
  ['Gearing ratios','Concerned with how far the business relies on debt: an important factor in assessing risk.'],
  ['Risks of high gearing','Interest rate risk (rates rise); default risk (miss an agreed payment); bankruptcy/insolvency risk (can\u2019t meet obligations even after liquidating assets).'],
  ['Retained earnings','By far the most important source of new finance for UK businesses by value.'],
  ['Short-term sources','Bank overdraft (flexible, cheap, repayable on demand); debt factoring and invoice discounting (borrow against receivables).'],
  ['Long-term sources','Ordinary and preference shares; loans (term loans, mortgages, convertible loan notes, bonds); finance leases; sale and leaseback; hire purchase.'],
  ['Islamic finance','Charging pure interest is considered wrong: all investors should share the business risk; Sharia-compliant bonds are used instead.'],
  ['SMEs','Face a funding gap: seen as risky (limited track record, few tangible assets for security). Sources: owner, family and friends, business angels, trade credit, factoring, leasing, bank finance, venture capital.']
 ],
 traps:['Gearing uses NON-CURRENT liabilities only.','Interest cover uses OPERATING profit.'],

{id:'t1c10', unit:'Unit 6', title:'Investment appraisal',
 sum:'Payback, ARR, NPV and which cash flows count',
 note:'The advantages and limitations slides for payback, ARR and NPV were images. Those points here follow the module textbook (Atrill & McLaney, Chapter 10).',
 an:{
  football:'Signing a £10m striker: payback asks how many seasons of extra ticket and shirt sales it takes to earn the £10m back. NPV asks what those future earnings are worth in today\u2019s money, because £1m in five years is worth less than £1m now.',
  business:'A £5,000 coffee machine earns an extra £2,000 a year. Payback = 2.5 years. But £2,000 in year 3 is worth less today, so NPV discounts it at the café\u2019s cost of capital.',
  household:'Solar panels cost £6,000 and save £1,000 a year: 6-year payback. NPV would also ask what those future savings are worth today, given what the £6,000 could earn in savings.'
 },
 steps:[
  'Payback: add cash inflows year by year until they equal the investment. Part year = amount still needed ÷ that year\u2019s cash flow.',
  'ARR = average annual profit ÷ average investment × 100.',
  'ARR profit = cash flow minus straight-line depreciation, where depreciation = (cost − scrap) ÷ years. Average investment = (cost + scrap) ÷ 2.',
  'NPV: discount factor = 1 ÷ (1 + r)ⁿ. PV = cash flow × factor. NPV = total PV − investment. Accept if positive.',
  'Ignore sunk costs (money already spent on research), non-cash items (depreciation) and costs paid anyway.'
 ],
 exam:[
  ['Investment appraisal','Analysis of the profitability of an investment over the life of an asset, alongside affordability and strategic fit.'],
  ['Payback period','The time it takes for a project to repay its initial investment. Simple and focuses on liquidity, but ignores cash flows after payback and the time value of money.'],
  ['ARR','The average profit from an investment as a percentage of the average investment. Linked to ROCE, but uses accounting profit, not cash, and ignores timing.'],
  ['NPV','Sums the present values of future cash flows and subtracts the initial investment, using WACC as the discount rate. Accept if positive. Accounts for the time value of money, but relies on estimating the cost of capital.'],
  ['Time value of money','£100 now is worth more than £100 in a year because it could be invested: the opportunity cost of money.'],

  ['Financing and investment link','The financing decision sets the cost of capital (WACC), which is the discount rate in NPV.']
 ],

essays:[
 {id:'e1', topic:'t1c3', title:'Profitability: evaluate and recommend', src:'tutor', marksNote:'Question and model answer from the Unit 1–5 revision slides. Mark split suggested.',
  stem:'The table shows the profitability ratios of a company for two years.',
  table:[['','2022','2023'],['Gross profit margin','41%','36%'],['Operating profit margin','24%','12%']],
  parts:[
   {label:'(a)', marks:12, q:'Evaluate the profitability of the company for the past two years, covering both ratios.',
    points:[['Explains what gross profit margin measures (revenue left after cost of sales; production and pricing efficiency)',2],['Interprets the fall in pence: about 5p less gross profit per £1 of sales',2],['Reasons for the GPM fall: lower sales prices and/or higher cost of sales (pricing pressure, discounts, product mix)',2],['Explains what operating profit margin measures (profit after all operating expenses)',2],['Notes the OPM almost halved, a much larger fall than GPM, pointing to rising operating expenses',2],['Overall conclusion: profitability declined, with three concerns (sales, cost of sales, overheads)',2]]},
   {label:'(b)', marks:8, q:'Recommend two ways to improve the performance of the company, clearly justifying your recommendations.',
    points:[['Recommendation 1 stated clearly (e.g. reduce cost of sales: cheaper supplier, renegotiate prices, bulk buying)',2],['Justified: how it would lift the gross margin while keeping quality and price',2],['Recommendation 2 stated clearly (e.g. review overheads and cut operating costs, automate processes)',2],['Justified: how it would lift the operating margin',2]]}
  ],
  model:['(a) Gross profit margin fell from 41% to 36%, around 5p less gross profit for every £1 of revenue. This shows lower profitability in 2023, driven by lower sales prices, higher cost of sales, or both. Operating profit margin fell from 24% to 12%, almost halving. Given the gross margin fall, some decline was expected, but this is far larger, suggesting the company has incurred additional operating expenses. Overall the ratios highlight three concerns: a possible drop in sales, a rise in cost of sales and a significant rise in operating expenses.',
         '(b) First, reduce cost of sales while maintaining product quality and price: find a cheaper supplier of similar quality, negotiate better prices with current suppliers or buy in bulk. This lifts the gross margin. Second, review overheads to pinpoint where costs can be cut, for example by automating manual processes. This tackles the sharp fall in the operating margin.']},
 {id:'e2', topic:'t1c5', title:'Liquidity: compare two companies', src:'tutor', marksNote:'Question and marks from the Unit 1–5 revision slides.',
  stem:'The table shows liquidity ratios for two companies.',
  table:[['','ABC','XYZ'],['Current ratio','2.5 : 1','3 : 1'],['Quick (acid) ratio','0.85 : 1','1.5 : 1']],
  parts:[

  model:['The current ratio measures the ability to pay short-term obligations from current assets; the quick ratio shows capacity to pay current liabilities without selling inventory. XYZ has higher ratios on both measures. ABC\u2019s quick ratio of 0.85:1 is below 1, suggesting a large proportion of its current assets are tied up in inventory and it may struggle to meet obligations as they fall due. XYZ has the healthier liquidity position, but it should make sure it isn\u2019t over-investing in current assets and missing chances to reinvest them for returns.']},
 {id:'e3', topic:'t1c6', title:'Efficiency: company vs industry', src:'tutor', marksNote:'Question and model answer from the Unit 1–5 revision slides. Mark split suggested.',
  stem:'The table shows working capital ratios for a company in 2020 against the industry average.',
  table:[['','2020','Industry average'],['Avg settlement period, trade receivables','15 days','10 days'],['Avg settlement period, trade payables','20 days','7 days'],['Avg inventory turnover period','8 days','5 days']],
  parts:[
   {label:'(a)', marks:12, q:'Evaluate the efficiency of the company in managing its working capital, covering all three ratios.',
    points:[['Receivables: customers take longer to pay than the industry; poor collection or credit control',3],['Payables: much longer than industry; keeps cash, but risks supplier goodwill and may signal cash flow problems',3],['Inventory: holding stock longer than industry; possible poor inventory management, a risk with perishable goods',3],['Explains what each ratio represents',2],['Overall judgement on working capital management',1]]},
   {label:'(b)', marks:8, q:'Recommend two ways the company could improve its efficiency, with clear justifications.',
    points:[['Receivables action (clear credit policy, credit checks, chase debts, early payment discounts)',2],['Justification of receivables action',2],['Inventory action (ABC analysis, reorder levels, JIT, reliable records) or payables action (clear payables policy, align with receivables)',2],['Justification of second action',2]]}
  ],
  model:['(a) The receivables period is 15 days against an industry average of 10, so customers take longer to pay. This reflects poor management of receivables and collections and possible credit control problems. The payables period of 20 days is far above the industry\u2019s 7. That keeps cash in the business, but at this level it risks supplier goodwill and may signal cash flow difficulties. The inventory period of 8 days against 5 suggests weaker inventory management and possibly high stock levels, a real risk if the goods are perishable.',
         '(b) Revise the credit policy so credit customers are assessed before credit is offered, and tighten collection processes. This should bring the receivables period towards the industry average. For inventory, use selective control by value (ABC), set reorder levels, keep reliable records and consider just-in-time supply, reducing stock holding and freeing cash.']},
 {id:'e4', topic:'t1c9', title:'Gearing: evaluate, advise, alternatives', src:'tutor', marksNote:'Question and model answer from the Unit 1–5 revision slides. Mark split suggested.',
  stem:'Finley plc\u2019s ratios for two years are shown below.',
  table:[['','2022','2023'],['Gearing ratio','29%','52%'],['Interest cover ratio','7 times','1.5 times']],
  parts:[
   {label:'(a)', marks:10, q:'Evaluate the financial gearing of the company.',
    points:[['Explains gearing (contribution of long-term lenders to the capital structure)',2],['Gearing rose from 29% to 52%: now relies more on debt than equity; reasons (more borrowing and/or lower equity)',2],['Explains interest cover (how easily operating profit covers interest)',2],['Cover fell from 7 to 1.5 times; reasons (more interest and/or lower operating profit)',2],['Implications: higher risk of default, lenders may take action, higher cost of capital',2]]},
   {label:'(b)', marks:4, q:'Recommend whether raising the needed funds through debt is advisable.',
    points:[['Advises against more debt',2],['Justifies with the low interest cover and already high gearing',2]]},
   {label:'(c)', marks:6, q:'Recommend alternative sources of capital the company could use.',
    points:[['Retained earnings: no external approvals or costs, but may not be enough',3],['New shares: no repayment or interest, but costly to issue and dilutes existing shareholders',3]]}
  ],
  model:['(a) The gearing ratio measures the contribution of long-term lenders to the capital structure. It rose from 29% to 52%, so the company now relies more heavily on debt than equity. Interest cover shows how easily operating profit covers interest: it fell from 7 times to 1.5 times, meaning extra debt has sharply reduced the company\u2019s ability to meet interest payments. A small fall in profit could leave interest unpaid.',
         '(b) Debt is generally cheaper than equity, but too much debt raises default risk and the returns investors demand. With interest cover this low, further borrowing is not advisable.',
         '(c) Retained earnings are the most preferable source: no external approvals or issue costs, though reserves may not be enough. Issuing new shares avoids repayment and interest charges, but it is costly and dilutes existing shareholders.']},

{id:'t2c2', unit:'Unit 7', title:'Cost classifications',
 sum:'Direct/indirect; fixed, variable, mixed, step-fixed',
 an:{
  football:'Players\u2019 wages are fixed: the same whether 5,000 or 50,000 fans come. Printed programmes are variable: more fans, more programmes. The stadium\u2019s electricity bill is mixed: a standing charge plus usage. Opening a second stand needs a whole extra stewarding team, so that cost jumps in a step.',
  business:'In a sandwich shop, rent is fixed, bread is variable, and the electricity bill is mixed (a standing charge plus usage). Once you pass 200 sandwiches a day you need a second chef: that cost jumps in a step.',
  household:'Your rent is fixed. Your food shop is variable: more people, more food. A phone contract with a monthly fee plus extra data charges is mixed. Needing a second car once the family grows is a step.'
 },
 steps:[
  'Direct or indirect? Can you trace the cost easily to one unit (e.g. wood in one table)? Yes = direct. Shared across everything (e.g. factory overheads) = indirect.',
  'Fixed or variable? Picture output doubling. What happens to the TOTAL cost?',
  'Total stays the same = fixed. Total rises in proportion = variable. Has a fixed part plus a variable part = mixed. Stays flat, then jumps at a threshold = step-fixed.',
  'Watch "in total" vs "per unit": fixed cost is fixed in total but falls per unit as output rises. Variable cost changes in total but stays the same per unit.'
 ],
 exam:[
  ['Direct cost','A cost that can be identified with a specific cost unit, to the extent that its effect can be measured for that cost unit. Examples: direct material, direct labour.'],
  ['Indirect cost','The element of production cost that cannot be directly measured in respect of a particular cost unit. Example: manufacturing overhead.'],
  ['Cost object','Anything for which cost data are desired: products, product lines, customers, jobs, organisational subunits.'],
  ['Variable cost','A cost that varies, in total, in direct proportion to changes in the level of activity. Examples: raw material, sales commission, delivery cost per unit.'],
  ['Fixed cost','A cost that stays the same, in total, when the level of activity changes (within a relevant range). Examples: administrative salaries, insurance, rent, mortgage payments, straight-line depreciation.'],
  ['Mixed (semi-variable) cost','A cost that has an element of both fixed and variable cost. Example: electricity bills.'],
  ['Stepped fixed cost','A fixed cost that does not stay fixed over all levels of output but changes in steps as a threshold level of output is reached.']
 ],
 traps:['The module\u2019s own slides use "semi-fixed" to mean mixed, but the real mock used "semi-fixed (stepped) cost" as a WRONG answer for the "both fixed and variable" definition. Rule: "both elements" = mixed cost; anything that says "stepped" = step-fixed.','Always read the whole option, not just the first word.'],

{id:'t2c3', unit:'Unit 7', title:'Absorption vs marginal costing',
 sum:'Full cost, contribution, and why marginal costing supports CVP',
 an:{
  football:'Absorption costing asks: what does each fan cost us in total, including a share of player wages and stadium upkeep? Marginal costing asks: what\u2019s the extra cost of letting one more fan in? Just the programme and a bit of cleaning.',
  business:'Full (absorption) cost of a sandwich includes a slice of the rent and the chef\u2019s wages. Marginal cost is only what one extra sandwich adds: bread, filling, wrapper.',
  household:'The full cost of a home-cooked meal includes a share of the fridge, the oven and the gas standing charge. The marginal cost of one extra portion is just the extra ingredients.'
 },
 steps:[
  'Absorption cost per unit = direct materials + direct labour + direct expenses + production overheads (fixed AND variable).',
  'Marginal costing splits costs by behaviour: variable or fixed.',
  'Sales revenue − variable costs = contribution. Contribution − fixed costs = profit.',
  'Because it separates fixed and variable costs, marginal costing supports CVP analysis: break-even, margin of safety, target profit, contribution/sales ratio, limiting factors, special order pricing.'
 ],
 exam:[
  ['Absorption (full) costing','Tells us the total production cost of one unit of output. Absorbs all production costs into each unit, so the more units produced, the cheaper the cost per unit.'],
  ['Marginal costing','Tells us the variable production cost of one extra unit of output.'],
  ['Contribution margin','The amount remaining from sales revenue after variable expenses are deducted. It is available to cover fixed expenses and then provide profit.'],
  ['Absorption: limitations','Not appropriate when cost units differ in quality; ignores the effect of changes in the level of output on the cost structure.'],
  ['Contribution approach','The profit statement in fixed/variable format used for internal planning and decision-making (CVP). The traditional format classifies by function for external reporting.']
 ],
 traps:['Marginal costing supports CVP analysis, not budgeting or external financial reporting.','Marginal cost includes ALL variable production costs: materials, labour and variable overheads.'],
 qs:[

    {t:'Kaizen costing', fb:'Kaizen is about continual small cost savings during production.'}

{id:'t2c4', unit:'Unit 7', title:'CVP and break-even',
 sum:'Contribution, CM ratio, break-even point',
 an:{
  football:'Each ticket sells for £30 and costs £10 in stewards and cleaning per fan. That leaves £20 per fan to chip away at the £40,000 fixed matchday costs. You need 2,000 fans (£40,000 ÷ £20) before the club stops losing money.',
  business:'A sandwich sells for £5 and the ingredients cost £2, so each one leaves £3. Rent is £600 a month. You need to sell 200 sandwiches (£600 ÷ £3) to break even. Every sandwich after that is profit.',
  household:'A side job pays £15 an hour and travel costs £3 an hour, so you keep £12. Your phone and gym cost £60 a month. You need 5 hours (£60 ÷ £12) just to cover them.'
 },
 steps:[
  'Find the variable cost PER UNIT. Include every variable item, and convert labour to a per-unit figure (e.g. 4 hours × £20 = £80 per unit).',
  'Contribution per unit = selling price − variable cost per unit.',
  'Break-even point (units) = fixed costs ÷ contribution per unit.',
  'Break-even in £ sales = break-even units × selling price (or fixed costs ÷ CM ratio).',
  'CM ratio = contribution ÷ sales × 100. Change in contribution = CM ratio × change in sales.'
 ],
 exam:[
  ['CVP analysis','Helps managers understand the relationship between cost, volume and profit by focusing on five variables: prices of products, volume or level of activity, per unit variable costs, total fixed costs, and mix of products sold.'],
  ['Why break-even is useful','Managers compare expected volume with the break-even point to judge risk. If expected volume is only just above break-even, the venture is risky.'],
  ['Weaknesses of break-even analysis','Non-linear relationships between costs, revenues and volume; stepped fixed costs (most fixed costs are not fixed over all volumes); multi-product businesses struggle to allocate fixed costs.']
 ],
 traps:['Labour per unit: "1 hour at £15 makes 2 tubes" means £7.50 per tube, not £15.','Divide fixed costs by CONTRIBUTION, never by selling price.','Test 2 has no formula sheet: learn these formulas.'],
 qs:[
  {id:'t2c4a', type:'mcq', lvl:1, diag:true, calc:true, unconf:true,
   stem:'Wind Bicycle Co. sells bikes for £500 each. Variable cost is £300 per bike and fixed costs are £80,000 a month. What is the break-even point in bikes?',
   opts:[
    {t:'400 bikes', ok:true},
    {t:'160 bikes', fb:'You divided by the selling price (£80,000 ÷ £500). Divide by contribution per unit instead.'},
    {t:'267 bikes', fb:'You divided by the variable cost (£80,000 ÷ £300). Divide by contribution: price − variable cost.'},
    {t:'£200,000', fb:'That\u2019s break-even in £ sales (400 × £500). The question asks for the number of bikes.'}
   ],
   hint:'How much does each bike leave over after its own variable cost?',
   why:'Contribution = £500 − £300 = £200. Break-even = £80,000 ÷ £200 = 400 bikes.'},
  {id:'t2c4b', type:'mcq', lvl:1, calc:true,
   stem:'Wind Bicycle Co.: price £500, variable cost £300 per bike. What is the contribution margin ratio?',
   opts:[
    {t:'40%', ok:true},
    {t:'60%', fb:'That\u2019s the variable cost ratio (£300 ÷ £500). CM ratio uses contribution.'},
    {t:'66.7%', fb:'You divided contribution by variable cost. Divide by sales instead.'},
    {t:'£200', fb:'That\u2019s contribution per unit. The ratio expresses it as a % of the selling price.'}
   ],
   hint:'Contribution ÷ selling price × 100.',
   why:'Contribution £200 ÷ sales £500 × 100 = 40%. This matches the Unit 7 lecture.'},
  {id:'t2c4c', type:'mcq', lvl:2, calc:true,
   stem:'Wind Bicycle Co. has a CM ratio of 40%. If sales revenue rises by £50,000, by how much does total contribution rise?',
   opts:[
    {t:'£20,000', ok:true},
    {t:'£30,000', fb:'That\u2019s the 60% that goes on variable costs. Use the 40% CM ratio.'},
    {t:'£50,000', fb:'Not all of the extra revenue is contribution: 60% of it goes on variable costs.'},
    {t:'£10,000', fb:'Check the calculation: 40% × £50,000.'}
   ],
   hint:'Change in contribution = CM ratio × change in sales.',
   why:'£50,000 × 40% = £20,000, as in the Unit 7 lecture solution.'},
  {id:'t2c4d', type:'mcq', lvl:2, calc:true, unconf:true,
   stem:'Olukale sells hair dye at £20 per tube. Monthly rent is £2,000. Materials cost £4.50 per tube. One hour of labour costs £15 and produces 2 tubes. What is the break-even point in tubes?',
   opts:[
    {t:'250 tubes', ok:true},
    {t:'4,000 tubes', fb:'You used £15 of labour per tube. One hour makes 2 tubes, so labour is £7.50 per tube.'},
    {t:'129 tubes', fb:'You left out labour. Variable cost includes materials AND labour per tube.'},
    {t:'100 tubes', fb:'You divided rent by the selling price. Divide by contribution per tube.'}
   ],
   hint:'Labour per tube first: £15 ÷ 2. Then total variable cost per tube.',
   why:'Labour = £15 ÷ 2 = £7.50. Variable cost = £4.50 + £7.50 = £12. Contribution = £20 − £12 = £8. Break-even = £2,000 ÷ £8 = 250 tubes.'},
  {id:'t2c4e', type:'mcq', lvl:2, calc:true,
   stem:'Wind sells 500 bikes a month (price £500, variable cost £300, fixed costs £80,000). An extra £10,000 a month on advertising would lift sales to 540 bikes. What happens to profit?',
   opts:[

  {id:'t2c4f', type:'mcq', lvl:3, calc:true, unconf:true,
   stem:'PC Universe: fixed costs £2,000 a month. Each laptop needs raw materials of £150 and 4 hours of labour at £15 per hour. Selling price is £335. What is the break-even point in laptops and in total sales?',
   opts:[

  {id:'t2c4g', type:'mcq', lvl:3, calc:true,

{id:'t2c5', unit:'Unit 8', title:'Management accounting vs SMA',
 sum:'How strategic management accounting differs',

 },

 ],
 exam:[

  ['Strategic planning (5 steps)','1. Establish mission, vision and objectives. 2. Position analysis (e.g. SWOT). 3. Identify and assess strategic options. 4. Select options and form long and short-term plans. 5. Review performance and exercise control.']
 ],

 qs:[
  {id:'t2c5a', type:'mcq', lvl:1, diag:true,

{id:'t2c6', unit:'Unit 8', title:'Strategic costing',
 sum:'Traditional costing\u2019s flaws; attribute, life-cycle, target, kaizen',
 an:{
  football:'Target costing: fans will pay at most £30 a ticket and the club wants £6 profit on each, so a matchday must cost no more than £24 per fan. You design it that way before the season starts. Kaizen: every week the ground staff find small savings. Life-cycle costing: a new stadium\u2019s cost includes design, building, running and eventually demolition. Attribute costing: if away fans don\u2019t value padded seats, remove them.',
  business:'A phone-case maker knows customers pay £15 and wants £3 profit each, so the case must cost £12 or less. That\u2019s target costing, done at the design stage. Every month the team then trims small costs from production. That\u2019s kaizen.',
  household:'Buying a car on price alone ignores insurance, fuel, repairs and resale value. Counting all of them across the years you own it is life-cycle costing. Deciding you\u2019ll pay £8,000 max, then finding a car that fits, is target costing.'
 },
 steps:[
  'Traditional full costing: product cost (direct materials + direct labour + production overheads) + mark-up = selling price.',
  'Flaw 1: features customers don\u2019t value or won\u2019t pay for → fix with attribute (activity-based) costing.',
  'Flaw 2: cost-plus price may be higher than competitors\u2019 or more than customers will pay → fix with target costing.',
  'Flaw 3: only manufacturing costs, ignoring R&D and discontinuation costs → fix with life-cycle costing.',
  'Timing: target costing at the DESIGN stage; kaizen at the MANUFACTURING stage.'
 ],
 exam:[
  ['Activity-based (attribute) costing','Relates overheads to specific production, accepting that overheads are caused by activities that "drive" costs. Focuses on designing products with attributes customers value: compare each attribute\u2019s cost with its value; if cost exceeds value, eliminate, modify or enhance it.'],
  ['Total life-cycle costing','Reporting all the costs incurred during the entire life of a product or service, not just manufacturing cost. Especially important for products with short life cycles.'],
  ['Target costing','Starts with the planned selling price and deduces the target cost per unit needed to meet profit objectives. Applied during the design stage.'],
  ['Kaizen costing','Controls cost by continually making (often small) savings from one period to the next during the production stage. Aims to reduce manufacturing cost below the previous period\u2019s.']
 ],
 traps:['Traditional costing overlooks R&D, not packaging.','Market research is NOT part of full product cost (real mock trap).','The module pairs activity-based costing with attribute costing under one heading, so use its wording.'],
 qs:[
  {id:'t2c6a', type:'mcq', lvl:1, diag:true,
   stem:'Which technique starts with the planned selling price and deducts the required profit to find the cost that must be met?',
   opts:[
    {t:'Target costing', ok:true},
    {t:'Kaizen costing', fb:'Kaizen is continual small savings during production, not working back from a price.'},
    {t:'Total life-cycle costing', fb:'Life-cycle costing adds up all costs across a product\u2019s life.'},
    {t:'Absorption costing', fb:'Absorption costing builds UP a cost from production costs, the opposite direction.'}
   ],
   hint:'Price first, then profit, and what\u2019s left is the cost you must hit.',
   why:'Target costing: planned selling price − required profit = target cost. Applied at the design stage.'},
  {id:'t2c6b', type:'mcq', lvl:1, calc:true,
   stem:'Hale Ltd plans a product selling at £40. The target gross profit margin is 20%. What is the target cost per unit?',
   opts:[
    {t:'£32', ok:true},
    {t:'£8', fb:'That\u2019s the required profit (20% × £40). Target cost is what\u2019s left.'},
    {t:'£48', fb:'You added the margin. Target cost = price − margin.'},
    {t:'£33.33', fb:'That treats 20% as a mark-up on cost. The module applies the margin to the selling price.'}
   ],
   hint:'20% of £40 is the profit. Take it off the price.',
   why:'Margin = 20% × £40 = £8. Target cost = £40 − £8 = £32 (Unit 8 lecture).'},
  {id:'t2c6c', type:'mcq', lvl:2, calc:true,
   stem:'Rigby Ltd could sell 50,000 units at £10. Manufacturing cost is £6 per unit, design costs £125,000 and after-sales service £25,000. The required gross profit margin is 20%. Is the product feasible?',
   opts:[
    {t:'No: total cost £9 per unit exceeds the £8 target cost', ok:true},
    {t:'Yes: manufacturing cost £6 is below the £8 target cost', fb:'This ignores pre- and post-production costs, which is exactly the flaw life-cycle costing fixes.'},
    {t:'Yes: total cost £9 is below the £10 price', fb:'That ignores the required 20% margin. Compare with the target cost, not the price.'},
    {t:'No: total cost £11 per unit exceeds the price', fb:'Check: (£125,000 + £25,000) ÷ 50,000 = £3 per unit, so total cost is £6 + £3.'}
   ],
   hint:'Target cost = £10 − 20%. Then spread design and after-sales costs over 50,000 units.',
   why:'Target cost = £10 − £2 = £8. Pre and post costs = £150,000 ÷ 50,000 = £3. Total = £6 + £3 = £9 > £8, so not feasible.'},
  {id:'t2c6d', type:'match', lvl:2,
   stem:'Match each technique to its description.',
   blanks:[
    {s:'Applied at the design stage, working back from selling price: ___', a:'Target costing', c:'Kaizen costing', x:['Total life-cycle costing']},
    {s:'Continual small cost savings during the manufacturing stage: ___', a:'Kaizen costing', c:'Target costing', x:['Absorption costing']},
    {s:'All costs over a product\u2019s entire life, not just manufacturing: ___', a:'Total life-cycle costing', c:'Absorption costing', x:['Kaizen costing']},
    {s:'Designing products with features customers value; overheads driven by activities: ___', a:'Activity-based (attribute) costing', c:'Target costing', x:['Marginal costing']},
    {s:'Product cost plus a mark-up to set the selling price: ___', a:'Traditional full costing', c:'Target costing', x:['Marginal costing']}
   ],
   hint:'Design stage = target. Manufacturing stage = kaizen. Whole life = life-cycle.',
   why:'From the Unit 8 lecture on strategic costing tools.'},
  {id:'t2c6e', type:'match', lvl:3,
   stem:'Each flaw of traditional costing has a fix. Match them.',
   blanks:[
    {s:'The product has features customers don\u2019t value → ___', a:'Attribute costing', c:'Kaizen costing', x:['Target costing','Total life-cycle costing','Marginal costing']},
    {s:'The cost-plus price may be higher than competitors\u2019 → ___', a:'Target costing', c:'Attribute costing', x:['Kaizen costing','Total life-cycle costing','Marginal costing']},
    {s:'Only manufacturing costs are counted, ignoring R&D → ___', a:'Total life-cycle costing', c:'Target costing', x:['Kaizen costing','Attribute costing','Marginal costing']},
    {s:'Toyota staff at every level suggest small improvements each year → ___', a:'Kaizen costing', c:'Target costing', x:['Attribute costing','Total life-cycle costing','Marginal costing']}
   ],
   hint:'Features → attribute. Price → target. Missing costs → life-cycle.',
   why:'The module maps each traditional flaw to a fix: attribute, target and life-cycle costing. Toyota is its kaizen example.'},
  {id:'t2c6f', type:'mcq', lvl:3,
   stem:'A cross-functional team found customers placed little value on a matchbox having two striking surfaces. The box was redesigned with one, cutting production costs by 40%. Which technique is this?',
   opts:[
    {t:'Activity-based (attribute) costing', ok:true},
    {t:'Kaizen costing', fb:'Kaizen is continual small savings during production. This was a one-off design decision based on what customers value.'},
    {t:'Target costing', fb:'Target costing starts from a selling price. Here the team compared an attribute\u2019s cost with its value to customers.'},
    {t:'Total life-cycle costing', fb:'Life-cycle costing adds up costs across the product\u2019s whole life.'}
   ],
   hint:'The team judged one feature by what customers would pay for it.',
   why:'This is the module\u2019s own example of attribute costing: if an attribute\u2019s cost exceeds its value to customers, eliminate or modify it.'}
 ]},

{id:'t2c7', unit:'Unit 8', title:'Competitor analysis and CPA',
 sum:'Four aspects of competitors; customer profitability analysis',
 an:{
  football:'Scouting a rival: where are they going (title or survival?), how will they get there (tactics, transfers), how serious a threat are they (budget, squad depth), and how does their manager view the game? Customer profitability: some sponsors cost you more in hospitality and admin than they pay.',
  business:'A new café opens nearby. Where are they heading (one shop or a chain?), how (cheaper prices, better coffee?), how serious a threat (money, skilled staff?), and how do the owners see the market? Some of your own regulars run up tabs and want deliveries, so they cost more to serve than they bring in.',
  household:'You\u2019re bidding for a flat against someone else. What do they want, how will they get it, how serious a threat are they (cash buyer?), and how do they see the market? CPA at home: the friend who always needs picking up from the station costs you more than the one who drives.'
 },

  'Strategies: HOW does it expect to get there?',
  'Resources and capabilities: HOW SERIOUS is the potential threat?',
  'Assumptions: how do its managers VIEW the world?',

 ],
 exam:[

{id:'t2c8', unit:'Unit 8', title:'Balanced scorecard, lag and lead',
 sum:'Four perspectives; lag vs lead; hard vs soft',
 an:{
  football:'The league table is a lag indicator: it tells you what already happened. Players\u2019 fitness, training hours and the youth academy are lead indicators: they predict next season\u2019s results.',
  business:'Last month\u2019s profit is a lag indicator. Customer reviews and staff training are lead indicators: when they slip, profit follows a few months later.',
  household:'Your bank balance is a lag indicator. Your spending habits, like cooking at home, are lead indicators of next month\u2019s balance.'
 },
 steps:[
  'Four perspectives: Financial (satisfy shareholders), Customer (delight the customer), Internal business process (what we must excel at), Learning and growth (people and systems for long-term success).',
  'External measures: customers and shareholders. Internal measures: business process, learning and growth.',
  'Lag indicators = outcomes, looking back (sales revenue, profit, ROCE). Memory trick: lag = late.',
  'Lead indicators = drivers that predict the future (employee satisfaction, customer loyalty, product innovation).',
  'Hard = financial measures. Soft = non-financial measures.',
  'Chain: learning and growth → internal processes → customer → financial.'
 ],
 exam:[
  ['Balanced scorecard (BSC)','A strategic management tool that integrates financial and non-financial measures of performance in a single concise report, for the purpose of incorporating performance management within the strategic management process (Kaplan & Norton).'],
  ['Lag indicators','Measures that reflect outcomes: they measure the consequences of past management decisions (sales revenues, profits, ROCE).'],
  ['Lead indicators','Focus on the value and performance drivers that create wealth and help predict future performance (employee satisfaction, customer loyalty, product innovation).'],
  ['Perspective measures','Financial: ROCE, profit margin, gearing, cash flow, share price. Customer: satisfaction, retention, market share. Internal process: product quality, new product development. Learning and growth: employee satisfaction, average training hours.']
 ],
 traps:['Non-financial measures CAN be lag indicators, but are more useful as lead indicators.','External = customer and financial (shareholders), not internal process.'],

{id:'t2c9', unit:'Unit 8', title:'Shareholder value and EVA',
 sum:'What EVA measures and how to increase it',
 an:{
  football:'A club makes £5m profit. But the owners could have earned £8m by investing their money elsewhere. In economic terms the club has destroyed £3m of value, even though it made an accounting profit. That\u2019s what EVA measures.',
  business:'Your shop makes £20,000 profit after tax on £200,000 invested. Investors want at least 12%, which is £24,000. EVA = £20,000 − £24,000 = −£4,000. Profitable on paper, but not good enough for investors.',
  household:'Your savings earn £300 a year, but you owe £500 a year in interest on a loan. On paper you "earned" £300, but overall you\u2019re £200 worse off. Beating the cost of the money is what counts.'
 },
 steps:[
  'EVA = NOPAT − (R × C).',
  'NOPAT = net operating profit after tax. R = required return of investors (WACC). C = capital invested (net assets).',
  'Positive EVA = the business is increasing shareholder wealth.',
  'To increase EVA: increase NOPAT (cut expenses or increase sales revenue); reduce capital invested (sell assets not earning enough); reduce R by shifting the capital structure towards borrowing, which is generally cheaper than share capital.'
 ],
 exam:[
  ['EVA','A method for measuring whether the returns generated by the business exceed the required returns of investors.'],
  ['Why EVA','Traditional measures (ROSF, EPS) use accounting profit and do not take full account of investors\u2019 required returns. EVA is based on economic profit.'],
  ['Increasing EVA','Increase NOPAT; reduce capital invested by using assets more efficiently; reduce the required rate of return by favouring borrowing over share capital.']
 ],

 an:{

  'Penalties: legislation punishes manipulating records, destroying information and interfering with investigations; it protects whistle-blowers; chief executives can be criminally liable.',
  'Safeguards come from three places: the profession/legislation/regulation; within the client firm; within the employer\u2019s own systems and procedures.'
 ],

  if(q.table) q.table.forEach(function(r){ L.push(r.join(' | ')); });
  if(q.stem2) L.push(q.stem2);
  if(q.type==='mcq'){ q.opts.forEach(function(o,i){ L.push('- '+o.t+(o.ok?'  [marked correct]':'')); }); if(st && st.sel!=null) L.push('My answer: '+q.opts[st.sel].t); }
  else if(q.blanks){ q.blanks.forEach(function(b,i){ L.push((i+1)+'. '+b.s+'  [answer: '+b.a+']'+(st&&st.sel?'  [mine: '+(st.sel[i]||'none')+']':'')); }); }
  L.push('What looks wrong: ');
  return L.join('\n');
}
function copyPlain(txt, msg){
  function fallback(){ var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(fallback); } else fallback();
  toast(msg);
}

// ---------- practice ----------
function freshSet(tid){
  var t=TOPICS[tid], list=GEN.practiceSet(tid,5)||[];
  var bank=[]; t.qs.forEach(function(q){ if(q.type==='match') q.blanks.forEach(function(b){ bank.push(b); }); });
  var nm = list.length ? 1 : 2;
  for(var k=0;k<nm && bank.length>=5;k++){ var sh=shuffle(bank), pick=[], used=[], txt=[]; sh.forEach(function(b){ if(pick.length<5 && used.indexOf(b.a)<0 && txt.indexOf(b.s)<0){ pick.push(b); used.push(b.a); txt.push(b.s);} }); sh.forEach(function(b){ if(pick.length<5 && txt.indexOf(b.s)<0){ pick.push(b); txt.push(b.s);} });
    list.push({type:'match', lvl:3, stem:'Mixed practice: choose the correct answer for each.', blanks:pick, hint:'Look for the key word that separates the two closest options.', why:'Mixed from this topic\u2019s definitions.'}); }
  if(!GEN.practiceSet(tid,1)) shuffle(t.qs.filter(function(q){return q.type==='mcq';})).slice(0,3).forEach(function(q){ list.unshift(q); });
  return list;
}
function startPractice(tid, fresh){
  var t=TOPICS[tid];
  var list=fresh ? freshSet(tid) : t.qs.slice().sort(function(a,b){return a.lvl-b.lvl;});
  P={tid:tid, list:list, i:0, first:[], st:null, fresh:!!fresh};
  newQState();
  go('practice');
}
function newQState(){

}

function questionBody(q, st, mock){
  var h=stemHTML(q);
  if(q.type==='essay'){ q.parts.forEach(function(pt,i){ h+='<div class="part"><div class="ph"><span>'+esc(pt.label+' '+pt.q)+'</span><span class="tag">'+pt.marks+' marks</span></div><textarea class="ans" data-essay="'+i+'" aria-label="Your answer to part '+(pt.label||i+1)+'">'+esc(st.text[i]||'')+'</textarea></div>'; }); h+='<p class="small muted">Plan with CERI: Calculate, Explain, Reasons, Implications, Recommend. You\u2019ll mark this yourself after submitting.</p>'; return h; }
  if(q.type==='mcq'){
    st.order.forEach(function(oi){
      var o=q.opts[oi], cls='';
      if(st.done && o.ok) cls=' right';
      else if(st.checked && st.sel===oi && !o.ok) cls=' wrong';
      h+='<button class="opt'+cls+'" data-a="pick" data-p="'+oi+'" aria-pressed="'+(st.sel===oi)+'"'+(st.done?' disabled':'')+'>'+esc(o.t)+'</button>';
      if(!mock && st.checked && st.sel===oi && !o.ok && o.fb) h+='<div class="fb bad">'+esc(o.fb)+'</div>';
    });
  } else {
    h+='<div>';
    q.blanks.forEach(function(b,i){
      var r=st.res?st.res[i]:null, cls=r===true?' right':(r===false?' wrong':'');
      var lock = st.done || (r===true);
      h+='<div class="blank'+cls+'"><label for="b'+i+'">'+(i+1)+'. '+blankHTML(b.s)+'</label>';
      h+='<select id="b'+i+'" data-blank="'+i+'"'+(lock?' disabled':'')+'><option value="">Choose…</option>';
      st.opts[i].forEach(function(o){ h+='<option'+(st.sel[i]===o?' selected':'')+'>'+esc(o)+'</option>'; });
      h+='</select>';
      if(r===false && !mock){ h+='<div class="fb bad">'+esc(blankFeedback(b, st.lastSel?st.lastSel[i]:st.sel[i]))+(st.done?' Answer: <b>'+esc(b.a)+'</b>.':'')+'</div>'; }
      if(r===true && !mock) h+='<div class="fb good">Correct</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}
function checkPractice(){
  var q=P.list[P.i], st=P.st;
  if(q.type==='mcq'){
    if(st.sel===null){ toast('Choose an answer first.'); return; }
    st.checked=true;
    var ok=!!q.opts[st.sel].ok;
    if(st.attempt===1) P.first[P.i]=ok;
    if(ok || st.attempt>=2) st.done=true; else st.attempt++;
  } else {
    if(st.sel.some(function(s,i){ return !s && !(st.res&&st.res[i]); })){ toast('Fill every blank first.'); return; }
    st.res=q.blanks.map(function(b,i){ return st.sel[i]===b.a; });
    st.lastSel=st.sel.slice();
